<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOEIC 900 — 게임형 문제풀이</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;--bg2:#f5f5f4;--bg3:#f0efeb;
  --text:#1a1a18;--text2:#6b6b67;--text3:#9b9b96;
  --border:rgba(0,0,0,0.12);--border2:rgba(0,0,0,0.22);
  --blue:#378ADD;--blue-bg:#E6F1FB;--blue-text:#0C447C;
  --green:#1D9E75;--green-bg:#E1F5EE;--green-text:#085041;
  --red:#E24B4A;--red-bg:#FCEBEB;--red-text:#A32D2D;
  --amber-bg:#FAEEDA;--amber-text:#854F0B;
  --radius:8px;--radius-lg:12px;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#1c1c1a;--bg2:#272724;--bg3:#2e2e2b;
    --text:#f0efe9;--text2:#a0a09a;--text3:#6b6b65;
    --border:rgba(255,255,255,0.12);--border2:rgba(255,255,255,0.22);
    --blue:#85B7EB;--blue-bg:#0c2840;--blue-text:#B5D4F4;
    --green:#5DCAA5;--green-bg:#04342C;--green-text:#9FE1CB;
    --red:#F09595;--red-bg:#501313;--red-text:#F7C1C1;
    --amber-bg:#412402;--amber-text:#FAC775;
  }
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg3);color:var(--text);min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:24px 16px}
.wrap{width:100%;max-width:640px}
.screen{display:none}.screen.active{display:block}

/* header */
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.logo{font-size:15px;font-weight:600;color:var(--text)}
.logo span{color:var(--blue)}

/* metric row */
.metric-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:20px}
.metric{background:var(--bg2);border-radius:var(--radius);padding:12px;text-align:center}
.metric-val{font-size:22px;font-weight:600;color:var(--text)}
.metric-label{font-size:11px;color:var(--text2);margin-top:2px}

/* part cards */
.part-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.part-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px;cursor:pointer;transition:border-color .15s,transform .1s}
.part-card:hover{border-color:var(--border2);transform:translateY(-1px)}
.part-card.selected{border:2px solid var(--blue)}
.badge{font-size:11px;padding:3px 8px;border-radius:6px;font-weight:500;display:inline-block;margin-bottom:8px}
.badge-danger{background:var(--red-bg);color:var(--red-text)}
.badge-warn{background:var(--amber-bg);color:var(--amber-text)}
.badge-ok{background:var(--green-bg);color:var(--green-text)}
.part-name{font-size:14px;font-weight:600;color:var(--text);margin-bottom:4px}
.part-stat{font-size:12px;color:var(--text2)}

/* controls */
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
.controls label{font-size:13px;color:var(--text2)}
select{font-size:13px;padding:7px 10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);color:var(--text);cursor:pointer}

/* buttons */
button{cursor:pointer;font-family:inherit;transition:all .15s}
.btn{background:var(--bg);border:1px solid var(--border2);border-radius:var(--radius);padding:9px 18px;font-size:13px;color:var(--text)}
.btn:hover{background:var(--bg2)}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:500}
.btn-primary:hover{filter:brightness(1.1)}
.btn-primary:disabled{background:var(--bg2);color:var(--text3);border-color:var(--border);cursor:not-allowed;transform:none;filter:none}
.btn-block{width:100%;padding:12px;font-size:14px}
.btn-danger{background:var(--red);color:#fff;border-color:var(--red)}

/* game ui */
.prog-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.prog-wrap{flex:1;height:5px;background:var(--bg2);border-radius:3px;overflow:hidden}
.prog-bar{height:100%;background:var(--blue);border-radius:3px;transition:width .3s ease}
.prog-label{font-size:12px;color:var(--text2);min-width:40px;text-align:right}

.streak-row{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}
.dot{width:10px;height:10px;border-radius:50%;background:var(--border)}
.dot.hit{background:var(--green)}
.dot.miss{background:var(--red)}
.dot.cur{border:2px solid var(--blue);background:transparent}

.timer-wrap{height:4px;background:var(--bg2);border-radius:2px;margin-bottom:14px;overflow:hidden}
.timer-bar{height:100%;background:var(--blue);border-radius:2px;transition:width .1s linear}
.timer-bar.warn{background:#EF9F27}
.timer-bar.danger{background:var(--red)}

.qbox{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px;margin-bottom:12px}
.q-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.q-tag{font-size:11px;padding:3px 8px;border-radius:6px;background:var(--blue-bg);color:var(--blue-text);font-weight:500}
.q-num{font-size:12px;color:var(--text2)}
.passage{font-size:13px;color:var(--text2);line-height:1.75;margin-bottom:14px;padding:12px 14px;background:var(--bg2);border-radius:var(--radius);border-left:3px solid var(--blue)}
.stem{font-size:14px;font-weight:500;color:var(--text);line-height:1.6;margin-bottom:14px}
.choices{display:grid;gap:8px}
.choice{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:11px 14px;font-size:13px;color:var(--text);text-align:left;display:flex;align-items:flex-start;gap:10px;transition:all .15s;width:100%}
.choice:hover:not(:disabled){background:var(--bg2);border-color:var(--border2)}
.choice.selected{border-color:var(--blue);background:var(--blue-bg);color:var(--blue-text)}
.choice.correct{border-color:var(--green);background:var(--green-bg);color:var(--green-text)}
.choice.wrong{border-color:var(--red);background:var(--red-bg);color:var(--red-text)}
.choice:disabled{cursor:not-allowed}
.choice-key{width:22px;height:22px;min-width:22px;border-radius:50%;border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0;margin-top:0px}

.action-row{display:flex;gap:8px;margin-top:10px;justify-content:space-between;flex-wrap:wrap}
.exp-box{background:var(--bg2);border-radius:var(--radius);padding:14px;margin-top:12px;font-size:13px;color:var(--text);line-height:1.75;display:none}
.exp-box.show{display:block}
.exp-title{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}

/* top bar during game */
.game-topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.xp-pill{background:var(--blue-bg);color:var(--blue-text);font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px}
.timer-text{font-size:13px;font-weight:500;color:var(--text);min-width:32px;text-align:right}

/* result */
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.result-card{background:var(--bg2);border-radius:var(--radius);padding:16px;text-align:center}
.result-big{font-size:28px;font-weight:700;color:var(--text)}
.result-label{font-size:12px;color:var(--text2);margin-top:4px}
.rank-badge{display:inline-block;padding:7px 20px;border-radius:20px;font-size:14px;font-weight:600;margin-bottom:14px}
.feedback-box{font-size:13px;color:var(--text2);line-height:1.75;background:var(--bg2);padding:14px;border-radius:var(--radius);margin-bottom:20px}

/* loading */
.loading-box{text-align:center;padding:48px 0}
.loading-spinner{width:32px;height:32px;border:2px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}

/* wrong review header */
.review-header{background:var(--amber-bg);color:var(--amber-text);font-size:13px;font-weight:500;padding:10px 14px;border-radius:var(--radius);margin-bottom:14px}

@media(max-width:480px){
  .metric-row{grid-template-columns:repeat(2,1fr)}
  .part-grid{grid-template-columns:1fr}
  .controls{flex-direction:column;align-items:flex-start}
  .result-grid{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div class="wrap">

<div class="header">
  <div class="logo">TOEIC <span>900</span> 트레이너</div>
  <div style="font-size:12px;color:var(--text2)" id="hd-date"></div>
</div>

<!-- HOME -->
<div id="screen-home" class="screen active">
  <div class="metric-row">
    <div class="metric"><div class="metric-val" id="s-total">0</div><div class="metric-label">총 문제</div></div>
    <div class="metric"><div class="metric-val" id="s-correct">0</div><div class="metric-label">정답</div></div>
    <div class="metric"><div class="metric-val" id="s-streak">0</div><div class="metric-label">최대 연속</div></div>
    <div class="metric"><div class="metric-val" id="s-xp">0</div><div class="metric-label">XP</div></div>
  </div>

  <div style="font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px">파트 선택</div>
  <div class="part-grid">
    <div class="part-card" onclick="selectPart('5')" id="pc-5">
      <span class="badge badge-warn">우선순위 상</span>
      <div class="part-name">Part 5</div>
      <div class="part-stat">단문 빈칸 · 현재 73%</div>
    </div>
    <div class="part-card" onclick="selectPart('6')" id="pc-6">
      <span class="badge badge-danger">긴급</span>
      <div class="part-name">Part 6</div>
      <div class="part-stat">장문 빈칸 · 현재 50%</div>
    </div>
    <div class="part-card" onclick="selectPart('7')" id="pc-7">
      <span class="badge badge-ok">우선순위 중</span>
      <div class="part-name">Part 7</div>
      <div class="part-stat">독해 · 현재 80%</div>
    </div>
  </div>

  <div class="controls">
    <label>문제 수</label>
    <select id="qcount-sel">
      <option value="5">5문제 — 빠른 세션</option>
      <option value="10" selected>10문제 — 표준</option>
      <option value="20">20문제 — 풀세트</option>
    </select>
    <label>타이머</label>
    <select id="timer-sel">
      <option value="0">없음</option>
      <option value="30" selected>30초</option>
      <option value="60">60초</option>
      <option value="90">90초</option>
    </select>
  </div>

  <button class="btn btn-primary btn-block" id="start-btn" onclick="startGame()" disabled>파트를 먼저 선택하세요</button>
  <p style="font-size:12px;color:var(--text3);text-align:center;margin-top:10px">Claude AI가 실시간으로 TOEIC 실전 난이도 문제를 출제합니다</p>
</div>

<!-- LOADING -->
<div id="screen-loading" class="screen">
  <div class="loading-box">
    <div class="loading-spinner"></div>
    <div style="font-size:15px;font-weight:500;color:var(--text);margin-bottom:6px">문제 출제 중</div>
    <div id="loading-msg" style="font-size:13px;color:var(--text2)">AI가 실전 난이도로 생성하고 있습니다...</div>
  </div>
</div>

<!-- GAME -->
<div id="screen-game" class="screen">
  <div class="game-topbar">
    <div style="font-size:12px;color:var(--text2)">Part <span id="g-part">5</span></div>
    <div style="display:flex;gap:10px;align-items:center">
      <div class="xp-pill">XP <span id="g-xp">0</span></div>
      <div class="timer-text" id="g-timer-txt"></div>
    </div>
  </div>
  <div class="prog-row">
    <div class="prog-wrap"><div class="prog-bar" id="g-prog" style="width:0%"></div></div>
    <div class="prog-label" id="g-prog-lbl">0/10</div>
  </div>
  <div class="streak-row" id="g-streak"></div>
  <div class="timer-wrap" id="g-timer-wrap" style="display:none">
    <div class="timer-bar" id="g-timer-bar" style="width:100%"></div>
  </div>
  <div id="q-area"></div>
  <div class="action-row">
    <button class="btn" id="exp-btn" onclick="showExp()" style="display:none">💡 해설 보기</button>
    <button class="btn btn-primary" id="next-btn" onclick="nextQ()" style="display:none;margin-left:auto">다음 문제 →</button>
  </div>
  <div class="exp-box" id="exp-box">
    <div class="exp-title">해설</div>
    <div id="exp-content"></div>
  </div>
</div>

<!-- RESULT -->
<div id="screen-result" class="screen">
  <div style="font-size:18px;font-weight:600;margin-bottom:16px">세션 결과</div>
  <div class="result-grid">
    <div class="result-card"><div class="result-big" id="r-score">0/0</div><div class="result-label">정답</div></div>
    <div class="result-card"><div class="result-big" id="r-pct">0%</div><div class="result-label">정답률</div></div>
    <div class="result-card"><div class="result-big" id="r-xp">+0</div><div class="result-label">획득 XP</div></div>
    <div class="result-card"><div class="result-big" id="r-streak">0</div><div class="result-label">최대 연속</div></div>
  </div>
  <div id="r-rank" class="rank-badge"></div>
  <div class="feedback-box" id="r-feedback"></div>
  <div style="display:flex;gap:8px">
    <button class="btn btn-primary" onclick="goHome()" style="flex:1;padding:11px">다시 풀기</button>
    <button class="btn" id="review-btn" onclick="reviewWrong()" style="flex:1;padding:11px">오답 복습 ↺</button>
  </div>
</div>

</div>

<script>
const API = 'https://api.anthropic.com/v1/messages';

const S = {
  part:null, qs:[], cur:0, score:0, xp:0,
  streak:0, maxStreak:0, hist:[], wrongIdx:[],
  answered:false, timerMax:30, qCount:10,
  totalTotal:0, totalCorrect:0, totalXP:0, allTimeMaxStreak:0
};

document.getElementById('hd-date').textContent = new Date().toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'short'});

function selectPart(p){
  S.part = p;
  document.querySelectorAll('.part-card').forEach(c=>c.classList.remove('selected'));
  document.getElementById('pc-'+p).classList.add('selected');
  const b = document.getElementById('start-btn');
  b.disabled = false;
  b.textContent = 'Part ' + p + ' 시작하기';
}

function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+id).classList.add('active');
}

async function startGame(){
  if(!S.part) return;
  S.qCount = parseInt(document.getElementById('qcount-sel').value);
  S.timerMax = parseInt(document.getElementById('timer-sel').value);
  S.qs=[]; S.cur=0; S.score=0; S.xp=0;
  S.streak=0; S.maxStreak=0; S.hist=[]; S.wrongIdx=[];
  show('loading');
  await genQuestions();
}

async function genQuestions(){
  const desc = {
    '5':'TOEIC Part 5 단문 빈칸 채우기. 품사 판별(명사/동사/형용사/부사), 시제, 능동/수동태, 접속사, 전치사, 어휘 유형을 골고루 섞어서 출제.',
    '6':'TOEIC Part 6 장문 빈칸 채우기. 비즈니스 이메일 또는 사내 공지문 지문 하나에 4개의 빈칸([___] 표시). 문법형, 어휘형, 문장삽입형 혼합.',
    '7':'TOEIC Part 7 독해. 비즈니스 이메일·공지·기사 중 하나의 지문과 독해 문제 3개. 주제파악, 세부정보, 추론 유형 포함.'
  };
  const sets = S.part==='5' ? S.qCount : S.part==='6' ? Math.ceil(S.qCount/4) : Math.ceil(S.qCount/3);

  const prompt = `너는 TOEIC 990점 출제 전문가다.
${desc[S.part]}
총 ${sets}세트를 생성하라.
반드시 아래 JSON만 반환. 마크다운 코드블록 없이 순수 JSON.

{"questions":[{"part":"${S.part}","type":"문제유형","passage":"지문(Part5=null,Part6·7=지문텍스트,Part6빈칸=[___])","stem":"문제문장(빈칸=_____)","choices":["(A)","(B)","(C)","(D)"],"answer":0,"explanation":"정답이유+오답이유+실전판단기준(3문장)"}]}

answer는 0=A,1=B,2=C,3=D. 실제 TOEIC 시험 난이도로 출제.`;

  document.getElementById('loading-msg').textContent = `Part ${S.part} 문제 ${S.qCount}개를 출제하고 있습니다...`;
  try {
    const res = await fetch(API,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:4000,messages:[{role:'user',content:prompt}]})
    });
    const data = await res.json();
    let txt = data.content.filter(b=>b.type==='text').map(b=>b.text).join('');
    txt = txt.replace(/```json|```/g,'').trim();
    const parsed = JSON.parse(txt);
    S.qs = parsed.questions.slice(0, S.qCount);
    renderGame();
    show('game');
  } catch(e){
    document.getElementById('loading-msg').textContent = '오류가 발생했습니다. 다시 시도해주세요.';
    setTimeout(()=>show('home'), 2500);
  }
}

function renderGame(){
  const q = S.qs[S.cur];
  if(!q){ showResult(); return; }
  S.answered = false;
  clearInterval(S._timer);

  const total = S.qs.length;
  document.getElementById('g-prog').style.width = Math.round(S.cur/total*100)+'%';
  document.getElementById('g-prog-lbl').textContent = S.cur+'/'+total;
  document.getElementById('g-part').textContent = q.part;
  document.getElementById('g-xp').textContent = S.xp;

  const sr = document.getElementById('g-streak');
  sr.innerHTML = S.hist.map(h=>`<div class="dot ${h?'hit':'miss'}"></div>`).join('')+'<div class="dot cur"></div>';

  const keys = ['A','B','C','D'];
  let html = `<div class="qbox"><div class="q-meta"><span class="q-tag">${q.type}</span><span class="q-num">Q${S.cur+1} / ${total}</span></div>`;
  if(q.passage && q.passage!=='null' && q.passage!==null){
    html += `<div class="passage">${q.passage.replace(/\n/g,'<br>')}</div>`;
  }
  html += `<div class="stem">${q.stem}</div><div class="choices">`;
  q.choices.forEach((c,i)=>{
    html += `<button class="choice" id="ch-${i}" onclick="pick(${i})"><span class="choice-key">${keys[i]}</span><span>${c}</span></button>`;
  });
  html += `</div></div>`;
  document.getElementById('q-area').innerHTML = html;

  document.getElementById('exp-btn').style.display = 'none';
  document.getElementById('next-btn').style.display = 'none';
  document.getElementById('exp-box').classList.remove('show');
  document.getElementById('exp-content').textContent = '';

  if(S.timerMax > 0){
    document.getElementById('g-timer-wrap').style.display = 'block';
    document.getElementById('g-timer-txt').textContent = S.timerMax+'s';
    runTimer();
  } else {
    document.getElementById('g-timer-wrap').style.display = 'none';
    document.getElementById('g-timer-txt').textContent = '';
  }
}

function runTimer(){
  let left = S.timerMax;
  const bar = document.getElementById('g-timer-bar');
  const txt = document.getElementById('g-timer-txt');
  bar.className = 'timer-bar';
  bar.style.width = '100%';
  S._timer = setInterval(()=>{
    left--;
    bar.style.width = Math.round(left/S.timerMax*100)+'%';
    txt.textContent = left+'s';
    if(left<=10) bar.className='timer-bar danger';
    else if(left<=20) bar.className='timer-bar warn';
    if(left<=0){ clearInterval(S._timer); timeUp(); }
  },1000);
}

function timeUp(){
  if(S.answered) return;
  S.answered = true;
  const q = S.qs[S.cur];
  document.querySelectorAll('.choice').forEach(c=>c.disabled=true);
  document.getElementById('ch-'+q.answer).classList.add('correct');
  S.hist.push(false); S.streak=0; S.wrongIdx.push(S.cur);
  document.getElementById('exp-btn').style.display='inline-block';
  document.getElementById('next-btn').style.display='inline-block';
}

function pick(i){
  if(S.answered) return;
  S.answered = true;
  clearInterval(S._timer);
  const q = S.qs[S.cur];
  const ok = i===q.answer;
  document.querySelectorAll('.choice').forEach(c=>c.disabled=true);
  document.getElementById('ch-'+i).classList.add(ok?'correct':'wrong');
  if(!ok){
    document.getElementById('ch-'+q.answer).classList.add('correct');
    S.wrongIdx.push(S.cur);
  }
  if(ok){
    S.score++; S.streak++;
    if(S.streak>S.maxStreak) S.maxStreak=S.streak;
    const bonus = S.streak>=3?20:10;
    S.xp += bonus;
  } else { S.streak=0; }
  S.hist.push(ok);
  document.getElementById('g-xp').textContent = S.xp;
  document.getElementById('exp-btn').style.display='inline-block';
  document.getElementById('next-btn').style.display='inline-block';
}

function showExp(){
  const q = S.qs[S.cur];
  document.getElementById('exp-content').textContent = q.explanation;
  document.getElementById('exp-box').classList.add('show');
  document.getElementById('exp-btn').style.display='none';
}

function nextQ(){
  S.cur++;
  if(S.cur>=S.qs.length){ showResult(); return; }
  renderGame();
}

function showResult(){
  clearInterval(S._timer);
  const total = S.qs.length;
  const pct = Math.round(S.score/total*100);
  S.totalTotal += total; S.totalCorrect += S.score; S.totalXP += S.xp;
  if(S.maxStreak > S.allTimeMaxStreak) S.allTimeMaxStreak = S.maxStreak;
  document.getElementById('s-total').textContent = S.totalTotal;
  document.getElementById('s-correct').textContent = S.totalCorrect;
  document.getElementById('s-streak').textContent = S.allTimeMaxStreak;
  document.getElementById('s-xp').textContent = S.totalXP;

  document.getElementById('r-score').textContent = S.score+'/'+total;
  document.getElementById('r-pct').textContent = pct+'%';
  document.getElementById('r-xp').textContent = '+'+S.xp;
  document.getElementById('r-streak').textContent = S.maxStreak;

  let rank, rStyle, fb;
  if(pct>=90){ rank='S 랭크 🎯'; rStyle=`background:${getComputedStyle(document.documentElement).getPropertyValue('--green-bg')};color:${getComputedStyle(document.documentElement).getPropertyValue('--green-text')}`; fb='목표 점수에 근접한 정답률이다. 이 파트는 유지 전략으로 전환하고 약점 파트에 시간을 투자하라.'; }
  else if(pct>=80){ rank='A 랭크'; rStyle=`background:var(--blue-bg);color:var(--blue-text)`; fb='양호하다. 오답 해설을 반드시 확인하고 같은 유형을 다시 풀어라. 다음 세션에서 90%를 목표로 잡아라.'; }
  else if(pct>=70){ rank='B 랭크'; rStyle=`background:var(--amber-bg);color:var(--amber-text)`; fb='기준선이다. 틀린 문제의 유형을 분류해 집중 훈련이 필요하다. 오답 복습 후 동일 파트를 다시 돌려라.'; }
  else { rank='C 랭크'; rStyle=`background:var(--red-bg);color:var(--red-text)`; fb='집중 훈련 구간이다. 오답 해설을 꼼꼼히 읽고 같은 유형을 3회 이상 반복하라. 공부량보다 오답 분석에 시간을 써라.'; }

  const rb = document.getElementById('r-rank');
  rb.textContent = rank; rb.style.cssText = rStyle+';display:inline-block;padding:7px 20px;border-radius:20px;font-size:14px;font-weight:600;margin-bottom:14px';
  document.getElementById('r-feedback').textContent = fb;
  document.getElementById('review-btn').style.display = S.wrongIdx.length>0?'block':'none';
  show('result');
}

function goHome(){ show('home'); }

function reviewWrong(){
  if(!S.wrongIdx.length) return;
  const wrong = S.wrongIdx.map(i=>S.qs[i]);
  S.qs = wrong; S.cur=0; S.score=0; S.xp=0;
  S.streak=0; S.maxStreak=0; S.hist=[]; S.wrongIdx=[];
  renderGame();
  show('game');
  const g = document.getElementById('screen-game');
  const rh = document.createElement('div');
  rh.className='review-header';
  rh.textContent='오답 복습 모드 — 틀린 문제만 다시 풀고 있습니다';
  g.insertBefore(rh, g.firstChild);
}
</script>
</body>
</html>
